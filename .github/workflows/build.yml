name: Build and audit LT5Lyrics

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['mc1.21.11-v*', 'mc26.2-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: python
        run: |
          import json, os
          versions = [
              {'minecraft': '1.21.11', 'jdk': '21'},
              {'minecraft': '26.2', 'jdk': '25'},
          ]
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              tag = os.environ['GITHUB_REF_NAME']
              versions = [v for v in versions if tag.startswith('mc' + v['minecraft'] + '-v')]
              if len(versions) != 1:
                  raise SystemExit('Unknown version tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': versions}) + '\n')

  # Preserve validation of the original root project (Minecraft 26.3).
  root-build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native audit tooling
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew && ./gradlew build checkBtp --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: root-mc26.3
          path: build/libs/*.jar
          if-no-files-found: error

  version-build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract the reviewed version-specific source
        run: python tools/extract_version_source.py '${{ matrix.minecraft }}' version-project
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Compile and run headless checks
        working-directory: version-project
        run: ./gradlew clean build --no-daemon
      - name: Collect JARs, checksums, source identity and recursive native inventory
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          mkdir -p release-assets
          cp version-project/build/libs/*.jar release-assets/
          python tools/audit_natives.py release-assets/*.jar > release-assets/native-audit.json
          cp tools/version-sources.json release-assets/source-manifest.json
          printf 'Git commit: %s\nMinecraft: %s\n' "$GITHUB_SHA" "$MC_VERSION" > release-assets/BUILD-INFO.txt
          printf '%s\n' 'Prebuilt MediaPlayerInfo.dll provenance is unresolved; see NATIVES.md.' >> release-assets/BUILD-INFO.txt
          (cd release-assets && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mc${{ matrix.minecraft }}-release
          path: release-assets/
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: version-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mc*-release
          path: release-assets
          merge-multiple: true
      - name: Attach the exact build outputs to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "LT5Lyrics $RELEASE_TAG" \
            --notes "Built from the tagged, hash-checked version source. See NATIVES.md before publishing: MediaPlayerInfo.dll origin remains unverified. Install the normal JAR, not the sources JAR. Download and upload that exact artifact to Modrinth; verify SHA256SUMS."
